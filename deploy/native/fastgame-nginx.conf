# Separate file: does not touch any existing site. Cloudflare reaches it on port 2096
# (Origin Rule: fg.razmjou.com -> destination port 2096; SSL mode Full (strict)).
limit_req_zone $binary_remote_addr zone=fg_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=fg_login:10m rate=5r/m;

map $http_cf_connecting_ip $fg_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 2096 ssl;
    listen [::]:2096 ssl;
    server_name fg.razmjou.com;

    ssl_certificate     /etc/ssl/fastgame/origin.pem;
    ssl_certificate_key /etc/ssl/fastgame/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;

    location /panel/ {
        alias /opt/fastgame/panel/;
        try_files $uri $uri/ /panel/index.html;
        add_header X-Frame-Options DENY always;
    }

    location = /admin/auth/login {
        limit_req zone=fg_login burst=5 nodelay;
        include /opt/fastgame/app/deploy/native/fastgame-proxy.inc;
    }

    location / {
        limit_req zone=fg_api burst=40 nodelay;
        include /opt/fastgame/app/deploy/native/fastgame-proxy.inc;
    }
}
