# Usage: cp .env.example .env (fill it), then: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastgame
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: fastgame
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastgame"]
      interval: 5s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      FG_DATABASE_URL: postgresql+psycopg://fastgame:${DB_PASSWORD}@db:5432/fastgame
    depends_on:
      db: { condition: service_healthy }
    expose: ["8000"]

  admin:
    build: ../admin
    restart: unless-stopped
    expose: ["80"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, admin]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/fastgame.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_headers.inc:/etc/nginx/conf.d/proxy_headers.inc:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # certificate from certbot

volumes:
  dbdata:
