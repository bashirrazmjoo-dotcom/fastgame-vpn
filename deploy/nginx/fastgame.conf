limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://fg.razmjou.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fg.razmjou.com;
    ssl_certificate     /etc/letsencrypt/live/fg.razmjou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fg.razmjou.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 256k;

    # Admin panel (static files). Consider restricting by IP: allow <your-ip>; deny all;
    location /panel/ {
        add_header X-Frame-Options DENY always;
        proxy_pass http://admin:80/;
    }

    location = /admin/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # App API (/v1/...), admin API (/admin/...), /healthz
    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
}
