org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# Base URL of the FastGame API (must be https). Override per build:
#   ./gradlew assembleRelease -Pfastgame.apiBaseUrl=https://api.your-domain.com/
fastgame.apiBaseUrl=https://api.example.com/

# required by the embedded ics-openvpn library
android.nonTransitiveRClass=false
android.usesSdkInManifest.disallowed=true
