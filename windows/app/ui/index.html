<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self'; connect-src ipc: http://ipc.localhost">
  <title>FastGame</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="app">
    <header class="top">
      <div class="menu">
        <button class="round burger" id="btn-menu" aria-expanded="false" aria-controls="menu-panel" data-i18n-title="menu" title="" aria-label="menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path class="l1" d="M4 12L20 12"/><path class="l2" d="M4 12H20"/><path class="l3" d="M4 12H20"/></svg>
        </button>
        <div class="menu-panel" id="menu-panel" hidden>
          <button class="menu-item" id="btn-lang" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>
            <span data-i18n="change_language"></span>
          </button>
          <button class="menu-item" id="btn-theme" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span data-i18n="change_theme"></span>
          </button>
          <button class="menu-item" id="btn-mode" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
            <span data-i18n="mode_menu"></span><b class="badge" id="mode-badge">LAN</b>
          </button>
          <button class="menu-item" id="btn-update" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
            <span data-i18n="update_menu"></span><i class="dot" id="update-dot" hidden></i>
          </button>
          <button class="menu-item" id="btn-share-round" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>
            <span data-i18n="share_app"></span>
          </button>
        </div>
      </div>
      <h1 class="brand" dir="ltr">FastGame</h1>
      <span class="spacer"></span>
    </header>

    <section class="card connect">
      <button class="lv" id="btn-connect" type="button" role="switch" aria-checked="false" data-phase="idle">
        <svg viewBox="0 0 184 100" aria-hidden="true" focusable="false"><g class="lv-bloom"><rect x="15" y="30" width="154" height="76" rx="38" fill="hsl(210 100% 63%)" fill-opacity=".05"/><rect x="18" y="33" width="148" height="70" rx="35" fill="hsl(0 100% 63%)" fill-opacity=".05"/><rect x="21" y="36" width="142" height="64" rx="32" fill="hsl(195 100% 63%)" fill-opacity=".05"/><rect x="24" y="39" width="136" height="58" rx="29" fill="hsl(90 100% 63%)" fill-opacity=".05"/><rect x="27" y="42" width="130" height="52" rx="26" fill="hsl(270 100% 63%)" fill-opacity=".05"/><rect x="30" y="45" width="124" height="46" rx="23" fill="hsl(210 100% 63%)" fill-opacity=".05"/></g></svg>
        <span class="lv-ring" aria-hidden="true"></span>
        <svg viewBox="0 0 184 100" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="lvBase" x1="0" y1="0" x2="0" y2="1"><stop class="lv-top" offset="0"/><stop class="lv-bot" offset="1"/></linearGradient>
            <linearGradient id="lvOff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d2d2d2"/><stop offset="1" stop-color="#a6a6a6"/></linearGradient>
            <linearGradient id="lvOn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#66bb6a"/><stop offset="1" stop-color="#3b9440"/></linearGradient>
            <radialGradient id="lvBall" cx=".35" cy=".325" fx=".35" fy=".325" r=".8"><stop offset="0" stop-color="#e85050"/><stop offset=".5" stop-color="#c62828"/><stop offset="1" stop-color="#8e1010"/></radialGradient>
            <clipPath id="lvClip"><rect x="0" y="0" width="184" height="78"/></clipPath>
          </defs>
          <rect x="24.6" y="59.2" width="134.8" height="40" rx="27" fill="#000" fill-opacity=".04"/><rect x="25.8" y="57.6" width="132.4" height="40" rx="26" fill="#000" fill-opacity=".04"/><rect x="27" y="56" width="130" height="40" rx="25" fill="#000" fill-opacity=".04"/><rect x="28.2" y="54.4" width="127.6" height="40" rx="24" fill="#000" fill-opacity=".04"/><rect x="29.4" y="52.8" width="125.2" height="40" rx="23" fill="#000" fill-opacity=".04"/><rect x="30.6" y="51.2" width="122.8" height="40" rx="22" fill="#000" fill-opacity=".04"/><rect x="31.8" y="49.6" width="120.4" height="40" rx="21" fill="#000" fill-opacity=".04"/>
          <rect x="33" y="48" width="118" height="40" rx="20" fill="url(#lvBase)"/>
          <rect x="42" y="58.5" width="100" height="19.5" rx="9" fill="#000" fill-opacity=".18"/>
          <rect x="42" y="60" width="100" height="18" rx="9" fill="url(#lvOff)"/>
          <rect class="lv-slot-on" x="42" y="60" width="100" height="18" rx="9" fill="url(#lvOn)"/>
          <g id="lv-ball-shadow"><circle r="23" fill="#000" fill-opacity=".035"/><circle r="21.5" fill="#000" fill-opacity=".035"/><circle r="20" fill="#000" fill-opacity=".035"/><circle r="18.5" fill="#000" fill-opacity=".035"/></g>
          <g clip-path="url(#lvClip)">
            <g id="lv-lever-shadow"><rect x="-6" y="-52" width="12" height="52" fill="#000" fill-opacity=".22"/></g>
            <g id="lv-lever"><rect x="-6" y="-52" width="12" height="52" fill="#6e6e6e"/><rect x="-4.25" y="-52" width="8.5" height="52" fill="#b9b9b9"/><rect x="-3.2" y="-52" width="4" height="52" fill="#f4f4f4"/></g>
          </g>
          <g id="lv-ball"><circle r="17" fill="url(#lvBall)"/><circle cx="-6.8" cy="-7.65" r="3.4" fill="#fff" fill-opacity=".8"/></g>
        </svg>
      </button>
    </section>

    <div class="banner" id="banner" aria-hidden="true"><div class="card"><div class="status" id="status"><span class="st-a" aria-hidden="true"></span><span class="st-b" aria-hidden="true"></span></div></div></div>
    <span class="sr-only" id="status-text" role="status" aria-live="polite"></span>

    <section class="card server">
      <span class="flabel" data-i18n="label_server"></span>
      <div class="lm srv" id="srv">
        <div class="lm-box">
          <div class="lm-bg"></div>
          <div class="lm-dark"></div>
          <button class="lm-bar" id="srv-bar" type="button" aria-expanded="false" aria-controls="srv-items">
            <span class="lm-title" id="srv-title"></span>
            <span class="lm-burger" aria-hidden="true"><i></i><i></i></span>
          </button>
          <div class="lm-items" id="srv-items"></div>
        </div>
      </div>
    </section>

    <section class="card timer" aria-live="off">
      <h2 data-i18n="time_card_title"></h2>
      <div class="tiles" dir="ltr">
        <div class="tile"><b id="t-d">0</b><span data-i18n="unit_days"></span></div>
        <div class="tile"><b id="t-h">0</b><span data-i18n="unit_hours"></span></div>
        <div class="tile"><b id="t-m">0</b><span data-i18n="unit_minutes"></span></div>
        <div class="tile"><b id="t-s">0</b><span data-i18n="unit_seconds"></span></div>
      </div>
      <p class="note" id="timer-note"></p>
    </section>

    <section class="card messages" id="messages" hidden role="status" aria-live="polite"></section>

    <section class="row">
      <button class="btn" id="btn-vip" data-i18n="buy_vip"></button>
      <button class="btn" id="btn-support" data-i18n="support"></button>
    </section>

    <section class="copycode" id="id-row" hidden>
      <div class="cc-progress" id="cc-progress"></div>
      <div class="cc-main">
        <div class="cc-text">
          <small data-i18n="label_your_id"></small>
          <span class="cc-code" id="user-code" dir="ltr"></span>
        </div>
        <button class="cc-btn" id="btn-copy" type="button" data-i18n="copy"></button>
      </div>
      <div class="cc-done" aria-live="polite">
        <span class="cc-tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
        <span data-i18n="id_copied"></span>
      </div>
    </section>

    <footer class="foot">
      <button class="link" id="btn-privacy" data-i18n="privacy_policy"></button>
      <span>·</span>
      <button class="link" id="btn-licenses" data-i18n="licenses"></button>
    </footer>
  </main>

  <dialog id="licenses-dialog">
    <h3 data-i18n="licenses"></h3>
    <pre id="licenses-text" dir="ltr"></pre>
    <button class="btn" id="btn-licenses-close" data-i18n="close"></button>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
