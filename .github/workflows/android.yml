name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the APK as a GitHub release (phone-friendly download)
    defaults:
      run:
        working-directory: android
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://fg.razmjou.com/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # native OpenVPN sources (ics-openvpn dependencies)
      - name: Accept SDK licenses and install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y swig
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
          validate-wrappers: false # we run the gradle we install, not the checked-in wrapper jar

      - name: Unit tests
        run: gradle testDebugUnitTest -Pfastgame.apiBaseUrl="$API_BASE_URL"

      - name: Debug APK
        run: gradle assembleDebug -Pfastgame.apiBaseUrl="$API_BASE_URL"

      - name: Small test APK (release build, public debug key; for sideload tests)
        env:
          FASTGAME_KEYSTORE_PATH: ${{ github.workspace }}/android/app/debug.keystore
          FASTGAME_KEYSTORE_PASSWORD: android
          FASTGAME_KEY_ALIAS: androiddebugkey
          FASTGAME_KEY_PASSWORD: android
        run: |
          gradle assembleRelease -Pfastgame.apiBaseUrl="$API_BASE_URL"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/FastGameVPN-small.apk"

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.FASTGAME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fastgame.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Signed release APK + AAB
        if: steps.key.outputs.signed == 'true'
        env:
          FASTGAME_KEYSTORE_PATH: ${{ runner.temp }}/fastgame.jks
          FASTGAME_KEYSTORE_PASSWORD: ${{ secrets.FASTGAME_KEYSTORE_PASSWORD }}
          FASTGAME_KEY_ALIAS: ${{ secrets.FASTGAME_KEY_ALIAS }}
          FASTGAME_KEY_PASSWORD: ${{ secrets.FASTGAME_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease -Pfastgame.apiBaseUrl="$API_BASE_URL"


      - name: APK size breakdown
        run: |
          ls -l app/build/outputs/apk/*/*.apk || true
          unzip -lv app/build/outputs/apk/debug/app-debug.apk | sort -k1 -n -r | head -12

      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/FastGameVPN.apk"
          gh release delete latest --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create latest "$RUNNER_TEMP"/FastGameVPN*.apk -R "$GITHUB_REPOSITORY" \
            --prerelease --title "Latest build" --notes "Build ${GITHUB_SHA::7} (test APK)"

      - uses: actions/upload-artifact@v4
        with:
          name: fastgame-apk-aab
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
      - name: Test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: android/app/build/reports
