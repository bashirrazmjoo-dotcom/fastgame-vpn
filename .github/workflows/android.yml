name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.example.com/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest -Pfastgame.apiBaseUrl="$API_BASE_URL"

      - name: Debug APK
        run: ./gradlew assembleDebug -Pfastgame.apiBaseUrl="$API_BASE_URL"

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.FASTGAME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fastgame.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Signed release APK + AAB
        if: steps.key.outputs.signed == 'true'
        env:
          FASTGAME_KEYSTORE_PATH: ${{ runner.temp }}/fastgame.jks
          FASTGAME_KEYSTORE_PASSWORD: ${{ secrets.FASTGAME_KEYSTORE_PASSWORD }}
          FASTGAME_KEY_ALIAS: ${{ secrets.FASTGAME_KEY_ALIAS }}
          FASTGAME_KEY_PASSWORD: ${{ secrets.FASTGAME_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease -Pfastgame.apiBaseUrl="$API_BASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: fastgame-apk-aab
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
      - name: Test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: android/app/build/reports
